# move_base parameters for ROS1 Noetic navigation
# Converted from Nav2 (ROS2) tiago_nav_params.yaml

base_global_planner: navfn/NavfnROS
base_local_planner: dwa_local_planner/DWAPlannerROS

controller_frequency: 20.0
planner_frequency: 20.0
recovery_behavior_enabled: true
clearing_rotation_allowed: true

oscillation_timeout: 10.0
oscillation_distance: 0.2

# DWA Local Planner parameters
DWAPlannerROS:
  min_vel_x: 0.0
  max_vel_x: 0.3
  max_vel_trans: 1.0
  min_vel_trans: 0.001
  max_vel_theta: 5.0
  min_vel_theta: 0.0
  acc_lim_x: 2.5
  acc_lim_y: 0.0
  acc_lim_theta: 3.2
  sim_time: 1.7
  vx_samples: 20
  vy_samples: 5
  vtheta_samples: 20
  xy_goal_tolerance: 0.25
  yaw_goal_tolerance: 0.25
  latch_xy_goal_tolerance: false
  path_distance_bias: 32.0
  goal_distance_bias: 24.0
  occdist_scale: 0.02
  forward_point_distance: 0.1
  stop_time_buffer: 0.2
  scaling_speed: 0.25
  max_scaling_factor: 0.2
  publish_traj_pc: true
  publish_cost_grid_pc: true

# NavFn Global Planner parameters
NavfnROS:
  allow_unknown: true
  default_tolerance: 0.5
  use_astar: false
  visualize_potential: false

# Global costmap parameters
global_costmap:
  global_frame: map
  robot_base_frame: base_link
  update_frequency: 1.0
  publish_frequency: 1.0
  resolution: 0.05
  robot_radius: 0.275
  track_unknown_space: true
  static_map: true
  rolling_window: false
  plugins:
    - {name: static_layer, type: "costmap_2d::StaticLayer"}
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
  static_layer:
    map_topic: /map
    subscribe_to_updates: true
  obstacle_layer:
    observation_sources: scan
    scan:
      topic: /scan_raw
      data_type: LaserScan
      clearing: true
      marking: true
      max_obstacle_height: 2.0
      raytrace_range: 3.0
      obstacle_range: 2.5
  inflation_layer:
    cost_scaling_factor: 3.0
    inflation_radius: 0.55

# Local costmap parameters
local_costmap:
  global_frame: odom
  robot_base_frame: base_link
  update_frequency: 5.0
  publish_frequency: 2.0
  rolling_window: true
  static_map: false
  width: 3
  height: 3
  resolution: 0.05
  robot_radius: 0.275
  plugins:
    - {name: obstacle_layer, type: "costmap_2d::VoxelLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
  obstacle_layer:
    observation_sources: scan
    origin_z: 0.0
    z_resolution: 0.05
    z_voxels: 16
    max_obstacle_height: 2.0
    publish_voxel_map: true
    scan:
      topic: /scan_raw
      data_type: LaserScan
      clearing: true
      marking: true
      max_obstacle_height: 2.0
      raytrace_range: 3.0
      obstacle_range: 2.5
  inflation_layer:
    cost_scaling_factor: 3.0
    inflation_radius: 0.55
